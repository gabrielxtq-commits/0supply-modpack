#Ativa ou desativa a Carteira.
enabled = true
#Limite maximo de moedas que a Carteira pode conter. O excedente e recusado ate que exista um Cofre (Fase 3).
# Default: 20000
# Range: 1 ~ 9223372036854775807
maxBalance = 20000
#Permite pagamentos entre jogadores atraves de /pay.
allowTransfers = true
#Quantidade maxima de movimentacoes mantidas no historico de cada jogador.
# Default: 100
# Range: 1 ~ 10000
historySize = 100
