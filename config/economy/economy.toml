#Ativa ou desativa completamente o Economy Mod.
enabled = true
#Nome da moeda utilizada pelo servidor.
currencyName = "Moedas"
#Simbolo exibido junto aos valores monetarios.
currencySymbol = "$"
#Saldo inicial concedido a um jogador novo.
# Default: 0
# Range: 0 ~ 9223372036854775807
startingBalance = 0
#Ativa mensagens de debug no console na inicializacao. Pode ser alternado em tempo real com /economy debug.
debug = false
#Idioma padrao das mensagens do mod.
language = "pt_br"
#Intervalo, em segundos, entre salvamentos automaticos.
# Default: 300
# Range: > 10
autosaveInterval = 300
