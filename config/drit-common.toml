# Chance for a redstone pulse to give the crop a random tick/age increase (1 in X chance)
# Default: 4
# Range: > 0
growthTickChance = 4
# If the crop should grow by random tick or by age (false - random tick, true - age)
randomOrAge = true
# How many times to tick/grow the crop
# Default: 1
# Range: > 0
tickingQuantity = 1
# If true, growth only triggers on a rising-edge redstone pulse (default behaviour). If false, growth is attempted every random tick using the chance from growthTickChance.
shouldRequireRedstone = true
